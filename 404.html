  <script>
    // Theme before the first paint, as on wearesalut.com: the saved choice or the system's.
    // ?review=1 underlines the facts that still wait for confirmation (class="tbc") on every page
    // of this visit, ?review=0 turns it off.
    (function () {
      var theme = null;
      var review = /[?&]review=1(&|$)/.test(window.location.search);
      try {
        theme = window.localStorage.getItem('salut-theme');
        if (review) window.sessionStorage.setItem('salut-review', '1');
        else if (/[?&]review=0(&|$)/.test(window.location.search)) window.sessionStorage.removeItem('salut-review');
        else review = window.sessionStorage.getItem('salut-review') === '1';
      } catch (error) {
        theme = null;
      }
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
      if (review) document.documentElement.classList.add('review');
    })();
  </script>
